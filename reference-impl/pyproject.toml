[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jvl"
version = "0.1.0"
description = "Jhana Verifiable Law — compile legal documents into statically-checkable programs"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jhana / JVL contributors" }]
keywords = ["law", "legal", "dsl", "compiler", "logic", "reasoning", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
jvl = "jvl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jvl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
