name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: reference-impl
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: reference-impl
        run: pytest -q
      - name: Smoke-test the CLI on every example
        working-directory: reference-impl
        run: |
          for f in ../examples/*.jvl; do
            echo "== check $f =="
            jvl check "$f"
          done
          jvl assert   ../examples/01-loan-vs-investment.jvl
          jvl discover ../examples/03-cheating-s420.jvl "Cheating(payment)"
          jvl constraints ../examples/02-nda-contract.jvl
