name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: reference-impl
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: reference-impl
        run: pytest -q
      - name: Smoke-test the CLI on every example
        working-directory: reference-impl
        # `check` must exit 0 (no errors). The reporting commands legitimately
        # return non-zero when they *find* something (a violated constraint, a
        # failed assertion, a contradiction, a difference) — that's a finding,
        # not a crash — so we only assert they run without erroring out (exit 2).
        run: |
          set -e
          for f in ../examples/*.lvl; do
            echo "== check $f =="
            lvl check "$f"
          done
          set +e
          run() { "$@"; local rc=$?; if [ $rc -eq 2 ]; then echo "CRASH ($rc): $*"; exit 1; fi; echo "ok ($rc): $*"; }
          run lvl assert   ../examples/01-loan-vs-investment.lvl
          run lvl discover ../examples/03-cheating-s420.lvl "Cheating(payment)"
          run lvl constraints ../examples/02-nda-contract.lvl
          run lvl check-contradictions ../examples/03-cheating-s420.lvl
          run lvl equiv ../examples/04-service-agreement-v1.lvl ../examples/04-service-agreement-v2.lvl
          run lvl assert ../examples/05-limitation-default.lvl
          run lvl emit ../examples/01-loan-vs-investment.lvl json

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test the in-browser JS engine (parity with the Python reference)
        run: node site/tests/engine.test.mjs
